<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
      margin: 0;
      background-color: #121212;
      color: #e0e0e0;
    }
    h3 {
      margin-top: 0;
      color: #ffffff;
      text-align: center;
      font-size: 16px;
      letter-spacing: 0.5px;
    }
    .divider {
      height: 1px;
      background-color: #333;
      margin: 12px 0;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    #status {
      margin: 15px 0;
      font-weight: 600;
      text-align: center;
      font-size: 14px;
    }
    /* Dashboard Metrics Layout */
    .metrics-container {
      background-color: #1e1e1e;
      border-radius: 8px;
      padding: 12px;
      margin-top: 10px;
    }
    .metric-row {
      margin-bottom: 10px;
    }
    .metric-row:last-child {
      margin-bottom: 0;
    }
    .metric-label {
      font-size: 11px;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #333;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%; /* Dynamic width handled by JS */
      background-color: #007bff;
      transition: width 0.4s ease-in-out;
    }
  </style>
</head>
<body>
  <h3>DUAL-STREAM DETECTOR</h3>
  <div class="divider"></div>
  
  <button id="scanBtn">Scan Current Frame</button>
  
  <div id="status">System Ready</div>

  <div class="metrics-container">
    <div class="metric-row">
      <div class="metric-label">
        <span>Stream 1: RGB Spatial Model</span>
        <span id="rgbVal">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="rgbBar" class="progress-bar-fill"></div>
      </div>
    </div>
    
    <div class="metric-row">
      <div class="metric-label">
        <span>Stream 2: Noise / ELA Filter</span>
        <span id="noiseVal">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div id="noiseBar" class="progress-bar-fill"></div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
